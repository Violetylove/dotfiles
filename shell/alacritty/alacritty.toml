[general]
working_directory = "C:/Users/ayana/"
live_config_reload = true
import = [
  "./themes/everforest_dark.toml",
  # "./themes/tokyo-night.toml",
  # "./themes/catppuccin.toml",
  # "./themes/",
  # "./themes/gruvbox_material.toml",
]

[bell]
animation = "EaseOutExpo"
color = "#ffffff"
duration = 1

[colors]
draw_bold_text_with_bright_colors = false

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750
vi_mode_style = "None"

[debug]
log_level = "Warn"

[font]
builtin_box_drawing = true
size = 12.0

[font.bold]
family = "CaskaydiaCove Nerd Font"
style = "Bold"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
style = "Bold Italic"

[font.italic]
family = "CaskaydiaCove Nerd Font"
style = "Italic"

[font.normal]
family = "CaskaydiaCove Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[hints]
alphabet = "jfkdls;ahgurieowpq"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToTop"
key = "Home"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "End"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "CreateNewWindow"
key = "W"
mods = "Alt|Shift"

[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Alt|Shift"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control"

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "Return"
mods = "Alt"

[[keyboard.bindings]]
action = "None"
key = "Paste"

[[keyboard.bindings]]
action = "None"
key = "Copy"

[[keyboard.bindings]]
action = "None"
key = "Insert"
mods = "Shift"

[terminal]

[mouse]
hide_when_typing = false
bindings = [{ mouse = "Right", action = "ExpandSelection" }]

[scrolling]
history = 10000
multiplier = 20

[selection]
semantic_escape_chars = """,│`|:"' ()[]{}<>\t"""
save_to_clipboard = true

[terminal.shell]
args = ["--nologo"]
program = "pwsh"
# program = "zsh"

[window]
# decorations = "None"                       # "Full" | "None" | "Transparent" | "Buttonless"
decorations_theme_variant = "Dark"
dynamic_padding = true
dynamic_title = false
opacity = 0.8
resize_increments = false
startup_mode = "Windowed"
title = "Alacritty"
dimensions = { columns = 140, lines = 35 }
padding = { x = 5, y = 5 }
position = { x = 450, y = 250 }

[keyboard]
